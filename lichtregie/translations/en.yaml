configuration:
  spotify_player:
    name: Spotify player
    description: Entity of the Spotify media player in HA, e.g. media_player.spotify_name. Provides title and position.
  freqblog_key:
    name: FreqBlog API key
    description: Key for the FreqBlog Music API (tempo and mood of tracks).
  lampen_grund:
    name: Lamps base colour
    description: Lights in the base colour of the track, e.g. ambilight rings of ceiling lamps.
  lampen_akzent:
    name: Lamps accent colour
    description: Lights in the accent colour, e.g. cabinets. Base and accent swap every phrase.
  lampen_aus:
    name: Off during the show
    description: Lights switched off during the show, e.g. main light. Their previous state is restored afterwards.
  airplay:
    name: AirPlay receiver
    description: Starts an AirPlay receiver for live audio analysis. Group it with the speaker in Music Assistant.
  airplay_name:
    name: AirPlay name
    description: Name of the receiver as shown in Music Assistant.
  laser_schalter:
    name: Laser power switch
    description: Switch entity of the laser's power outlet, e.g. switch.rgb_laser. Optional.
