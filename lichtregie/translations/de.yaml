configuration:
  spotify_player:
    name: Spotify-Player
    description: Optional. Entität des Spotify-Players in HA, z. B. media_player.spotify_name. Nur für die Warnung „Spotify spielt, aber kein Ton kommt an“; Titel und Position kommen von AirPlay.
  freqblog_key:
    name: FreqBlog-API-Schlüssel
    description: Schlüssel der FreqBlog Music API für Tempo und Stimmung der Titel.
  lampen_grund:
    name: Lampen Grundfarbe
    description: Lichter in der Grundfarbe des Liedes, z. B. die Ambilight-Ringe der Deckenlampen.
  lampen_akzent:
    name: Lampen Akzentfarbe
    description: Lichter in der Akzentfarbe, z. B. Vitrinen. Grund und Akzent tauschen pro Phrase.
  lampen_tv:
    name: LED-Streifen
    description: Schnelle Lichter ohne Befehlsgrenze (z. B. ein Govee-Streifen hinter dem TV über Bluetooth). Sie leuchten gedimmt in der Farbe des Liedes und blitzen weiß, wenn Drop oder Höhepunkt einsetzen (einstellbar).
  lampen_aus:
    name: Während der Party aus
    description: Lichter und Schalter (light., switch., input_boolean.), die der Party-Modus ausschaltet, z. B. das Hauptlicht. Danach kommt der alte Zustand zurück.
  geraete:
    name: Geräte der Party
    description: Schalter, die der Party-Modus einschaltet und am Ende wieder ausschaltet, z. B. die Steckdosen der Moving Heads (switch., input_boolean., light.). Die Laser-Steckdose gehört automatisch dazu.
  airplay:
    name: AirPlay-Empfänger
    description: Startet einen AirPlay-Empfänger für die Live-Audioanalyse. In Music Assistant mit dem Lautsprecher gruppieren.
  airplay_name:
    name: AirPlay-Name
    description: Name, unter dem der Empfänger in Music Assistant erscheint.
  laser_schalter:
    name: Laser-Steckdose
    description: Schalter der Steckdose des Lasers, z. B. switch.rgb_laser. Optional.
