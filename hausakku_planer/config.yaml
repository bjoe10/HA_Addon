name: Hausakku-Planer
version: "0.6.1"
slug: hausakku_planer
description: Plant Laden, Halten und Versorgen eines Heimspeichers nach dynamischen Strompreisen.
url: https://github.com/bjoe10/HA_Addon
arch:
  - amd64
  - aarch64
init: false
