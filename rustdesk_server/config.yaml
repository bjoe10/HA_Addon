name: "RustDesk Server + API"
version: "0.1.0"
slug: "rustdesk_server"
description: "Self-hosted RustDesk ID, relay and API server with web admin/client"
url: "https://github.com/bjoe10/HA_Addon/tree/main/rustdesk_server"
arch:
  - aarch64
  - amd64
startup: services
boot: auto
init: false
host_network: true
map:
  - type: app_config
    path: /app/data
    read_only: false
options:
  external_host: ""
  api_url: ""
  encrypted_only: true
  must_login: false
  allow_registration: false
  jwt_key: ""
schema:
  external_host: str
  api_url: str
  encrypted_only: bool
  must_login: bool
  allow_registration: bool
  jwt_key: password?
